# The CompTIA Troubleshooting Methodology

--

* ### identify the problem (example: Dr. Greenhalgh's website isn't updating)

--

* ### establish a theory of probable cause—question the obvious

--

* ### test the theory to determine cause

--

* ### establish a plan of action to resolve the problem

--

* ### verify and prevent

--

* ### document findings, actions, and outcomes

--
* entry-level technology certificate that demonstrates IT skills and knowledge

--
* especially good [for jobs like](https://www.comptia.org/certifications/a):

    * "service desk analyst"
    * "help desk tech"
    * "technical support specialist"
    * "field service technician"
    * "associate network engineer"
    * "data support technician"
    * "desktop support administrator"
    * "end user computing technician"
    * "help desk technician"
