Good morning! My name is Spencer Greenhalgh, and I am an associate professor of information communication technology at the University of Kentucky. This morning, I'll be presenting on "Jacques Ellul, Platforms, and Latter Day Saint Technical Responses to COVID-19," using "Latter Day Saint" here in a broad, multidenominational sense.

---

class: center, middle

# on platforms

???

the mid-2000s, the term "platform" has become widely used to describe many digital technologies. 

---

class: center middle

# "using the word ‘platform’ makes a claim that arguably misrepresents the way YouTube and other intermediaries really shape public discourse online"

Gillespie, T. (2010). The politics of 'platforms.' *new media & society*, *12*(3), 347-364. https://doi.org/10.1177/1461444809342738

???

As early as 2010, Gillespie argued that:

> "using the word ‘platform’ makes a claim that arguably misrepresents the way YouTube and other intermediaries really shape public discourse online" (Gillespie, 2010, p. 349)

Gillespie argued that tech companies' embrace of the term platform was a strategic, discursive move meant to suggest a certain banal neutrality and hide their influence on the creative activity that they were hosting.

If that was intent of tech giants in adopting the term platform, that's kind of backfired—at least in the academy, where internet researchers have begun using that term precisely to emphasize the ways that technical and governance aspects of digital services intervene in their users' experience.

---

class: center, middle

# "The platform has emerged as the endemic form of online enterprise, which is weird, because **another word for *platform* is *middleman***."

Doctorow, C. (2025). *Enshittification: Why Everything Suddenly Got Worse and What to Do About It.* New York: Farrar, Straus and Giroux.

???

Even writing for a lay audience, the technology activist Cory Doctorow (2025) has suggested that the simplest synonym for "platform" is "middleman," emphasizing the ways that these technologies not only facilitate but also intervene in social practices. This mediation may create tensions in the context of religious institutions, who may be wary of platforms' ability to mediate their activity in the digital realm. In short, while "unmediated religion" is impossible to achieve, churches may be cautious about whether, when, and how they allow outside technical forces to intervene.

# on COVID-19

???

In this presentation, I want to explore—and take some first steps toward explaining—the different approaches that two Latter Day Saint denominations took to digital platforms in response to the COVID-19 pandemic. I am a little self-conscious about doing a presentation that is inspired by COVID-19. While I'm doing a lot of Mormonism and technology research these days, my home discipline is actually educational technology. For perhaps obvious reasons, there was a 4-5 year period where it felt like every paper I was being asked to peer review in that field was on COVID-19 and this or COVID-19 and that. That's understandable, but sometimes it felt a little opportunistic, to be honest.

The thing is, though, that a world-changing event like COVID-19 really can give new insight into patterns and phenomena that were kind of already there but that something like a global pandemic brings into sharper focus. Let's take a look at an example of this that's been on my mind for a while.

Within the broader Latter Day Saint tradition, the Utah-based Church of Jesus Christ of Latter-day Saints is by far the largest denomination, with the Missouri-based Community of Christ coming in at a distant second. Both of these denominations—like, of course, nearly every religious institution on the planet—increased their use of digital platforms in response to COVID-19. However, there are clear differences in the ways that each denomination did so. Let's consider two such differences.

Second, let's look at sacred rites, known in these denominations as either sacraments or ordinances. Here, Community of Christ was the one to adopt digital platforms, allowing ministers to perform sacraments over Zoom or other video platforms. In contrast, the Church of Jesus Christ of Latter-day Saints insisted that ordinances continue to only be performed in person.

So, how is it that two traditions both clearly willing to adopt digital platforms and both drawing from the same historical foundations responded so differently in adopting those platforms in terms of conferences and sacred rites? 

This framing of the question is a bit of an oversimplification, both in that it exaggerates expected similarities between these two churches (which have been separate for far longer than they were ever together) and in that it does not get into some important details about these platform adoptions. However, it sets the stage, and I will add some more nuance shortly; first, though, my presentation today is much more of a theoretical exploration than an empirical case, so it's really important that I first establish a framework.

# on Jacques Ellul

???

The framework that I'm going to build my argument on is based on the writings of Jacques Ellul, a 20th century French sociologist and lay Protestant theologian.

---

class: center, middle

<a title="Jan van Boeckel, ReRun Productions, CC BY-SA 4.0 &lt;https://creativecommons.org/licenses/by-sa/4.0&gt;, via Wikimedia Commons" href="https://commons.wikimedia.org/wiki/File:Jacques_Ellul_(cropped).jpg"><img height="450" alt="Jacques Ellul" src="https://upload.wikimedia.org/wikipedia/commons/thumb/7/79/Jacques_Ellul_%28cropped%29.jpg/960px-Jacques_Ellul_%28cropped%29.jpg"></a>

<p style="font-size:10px"><a href="https://commons.wikimedia.org/wiki/File:Jacques_Ellul_(cropped).jpg">French sociologist and technology critique Jacques Ellul in his house in Pessac, France</a> by <a href="https://commons.wikimedia.org/wiki/User:Janboek">Jan van Boeckel</a> is licensed under <a href="https://creativecommons.org/licenses/by-sa/4.0/deed.en">CC BY-SA 4.0 International</a>.</p>

???

Because I'm surrounded by sociologists here, and because I am not a sociologist myself, I feel that it's important to add a caveat to that descriptor when talking about Ellul. Ellul was technically a professor of legal history who also taught political science classes, especially on Marx, and some contemporary Ellul scholars have suggested that his work is closer to philosophy or even critical theory than to modern sociology. I use the terms sociologist or sociological because they are the traditional lingo in Ellul Studies—and it is worth noting that the influential sociologist Robert Merton did write the introduction to the English translation of one of his most important books—but I concede that these terms are a bit misleading.

---

class: center, middle

## "These two components of the architecture of Ellul’s work are in no way separated or sealed off from one another. Ellul himself often affirmed that his entire project must be grasped as... a continual dialectical movement between... the critique of the technological society in its various dimensions, on the one hand, and by the confession of his faith and his hope, supported by meditations on Scripture and by biblical commentaries, on the other."

Rognon, F. (2024). Jacques Ellul's theology of technique: An introduction. *Ellul Forum*, 73, p. 28)

???

More pressing, though, is Ellul's shared identity as both sociologist and theologian and his belief (as described here by Frédéric Rognon) that each of those pursuits was inseparable from the other in the context of his work. The blurring of theological commitments and academic claims has, of course, frequently been a liability to the field of Mormon Studies, which raises an important question of whether Ellul is an appropriate thinker to invoke in this context.

In partial answer to that question, I want to emphasize that while I am adopting an Ellulian framework here, I am divorcing it from any theological normativity that he assigned to these concepts in his own writing (in the same way that I am divorcing it from his handwringing about women entering the workplace after the Second World War). Whatever Ellul believed about his own work, I do not believe that I must accept everything he wrote to find analytical value in some of what he wrote.

I also want to propose that at least some of the tension that I perceive (wearing my secular social scientist hat) between Ellul's identities as sociologist and theologian can be attenuated by understanding Ellul as an anarchist—and how his anarchism served as an influence on both of those other identities. 

---

class: center, middle

<img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c7/The_Dawn_of_Everything.jpg/960px-The_Dawn_of_Everything.jpg" height="600">

???

To show what I mean by this, let's first look at the anarchism-inflected book *The Dawn of Everything*, written a few years ago by the anthropologist David Graeber and the archaeologist David Wengrow. Let's take a look at a passage from the final chapter of the book that highlights some of their anarchist thinking, which echoes some of Ellul's own thoughts. 

---

class: center, middle

# "The fact that our planet is, at the present time, almost entirely covered by states obviously makes it easy to write as if such an outcome was inevitable."

Graeber, D., & Wengrow, D. (2021). *The dawn of everything: A new history of humanity*. Farrar, Straus and Giroux.

???

Even in this single sentence, we can tease out two dichotomies that Graeber and Wengrow explore throughout the book. First, a dichotomy between centralized, powerful political entities (that is, states) and less-hierarchical, consensus-oriented organizations of society. (This is maybe the more obviously anarchist idea). Second, a dichotomy between some inevitable course of human development and the possibility that groups of humans are capable of self-determinism in a big way (which echoes that optimism about consensus without hierarchy).

---

class: center, middle

These same dichotomies are recurring themes in Ellul's writing, whether sociological or theological, and it's those themes that I really want to zoom in on.

---

class: center, middle

# image vs. word

# reality vs. truth

???

Ellul frames these dichotomies in different ways throughout his work, but rather than explore all his different permutations, I'm going to use his twin comparisons of image and word and reality and truth, which serve as a throughline in his 1985 book *The Humiliation of the Word*. These comparisons are partly a media critique and partly an epistemological exploration.

On one hand, the image is seemingly self-evident. We have captured reality in a fixed state; every time I show that picture of Jacques Ellul, it's going to be the same. There is no more room for negotiation, we must conform to what the image tells us. The image is also technically mediated, through means like a camera. However, it is important to establish that what Ellul calls *technique* is broader than technology as we typically think of it: It also encompasses any systematized process that emphasizes efficacy and efficiency.

On the other, the word—more specifically, the spoken word—is always ambiguous and never quite the same. If I were to give this presentation five times, what I would say when that picture of Ellul came up would be different each time (or at least, it would if I hadn't scripted this out, which is why Ellul doesn't consider the written word to be the true word). Likewise, there is a truth deeper than reality that is never self-evident but can only be hammered out by constant dialogue, discussion, and dialectic.

???

So, what I'm going to argue here is that if we look at Latter Day Saint adoptions of platforms during the COVID-19 pandemic, we can understand the different patterns of adoption by a Utah preference for one side of this dichtomy and a Missouri openness to the other side. These denominations embraced digital platforms to the extent that those platforms were seen as supportive of their underlying stances toward media and epistemology. 

This is, of course, complicated by the fact that Ellul saw technique as overwhelmingly associated with the image, so I'm deliberately challenging his thinking here and opening up some future theoretical explanation.
